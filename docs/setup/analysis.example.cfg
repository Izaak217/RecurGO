# v0.1.2 source setup example; see docs/SOURCE_SETUP.md.
# This is an existing CUDA hardware baseline, not a universal strongest preset.
# KataGo JSON analysis configuration for the local Go coach application.
# Hardware baseline: one NVIDIA RTX 5070-class GPU with about 12 GB VRAM.
# Query-specific limits such as maxVisits are overridden by the application.

# Logging
logDir = data/logs/katago
logToStderr = true
logAllRequests = false
logAllResponses = false
logErrorsAndWarnings = true
logSearchInfo = false
warnUnusedFields = true

# Stable perspective for stored charts and comparisons.
reportAnalysisWinratesAs = BLACK
analysisPVLen = 20

# Safe defaults. Interactive and review modes override maxVisits per query.
maxVisits = 800

# Interactive latency baseline. These values will be benchmarked on this machine.
numAnalysisThreads = 2
numSearchThreadsPerAnalysisThread = 16
nnMaxBatchSize = 64

# This application targets standard 19x19 Go in its first release.
maxBoardXSizeForNNBuffer = 19
maxBoardYSizeForNNBuffer = 19
requireMaxBoardSize = true

# Neural-network cache and synchronization.
nnCacheSizePowerOfTwo = 23
nnMutexPoolSizePowerOfTwo = 17
nnRandomize = true

# Single CUDA GPU.
cudaDeviceToUse = 0
cudaUseFP16 = auto
cudaUseNHWC = auto

# Analysis behavior. Preserve broad candidate quality for coaching and review.
wideRootNoise = 0.04
ignorePreRootHistory = true
conservativePass = true
preventCleanupPhase = true
